services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: mcp_ops
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcp -d mcp_ops']
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: info
      DATABASE_URL: postgresql://mcp:mcp@postgres:5432/mcp_ops
      MCP_SERVER_SECRET: dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
